<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tolk｜PC音声をローカルで同時翻訳</title>
<meta name="description" content="共有した画面やタブの音声を聞き取り、字幕にして訳します。">
<meta name="theme-color" content="#0c0c0e">
<link rel="canonical" href="https://noxelwork.com/tolk">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:locale" content="ja_JP">
<meta property="og:url" content="https://noxelwork.com/tolk">
<meta property="og:title" content="Tolk｜PC音声をローカルで同時翻訳">
<meta property="og:description" content="共有した画面やタブの音声を聞き取り、字幕にして訳します。">
<meta property="og:image" content="https://noxelwork.com/tolk/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Tolk のロゴと「PCの音をブラウザだけで同時翻訳」「ローカルで動作し登録も不要」の文字">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:creator" content="@NoxelLab">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<script>
if (!(window.SpeechRecognition || window.webkitSpeechRecognition) || !('Translator' in self) || !navigator.mediaDevices?.getDisplayMedia) {
  document.documentElement.classList.add('unsupported');
}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <hgroup>
      <h1><svg viewBox="0 0 64 64" aria-hidden="true"><rect x=".5" y=".5" width="63" height="63" rx="14" fill="#0b0b0c" stroke="#2c2c2f"/><rect x="12" y="34" width="40" height="7" rx="3.5" fill="#ffd84a"/><rect x="20" y="46" width="24" height="5" rx="2.5" fill="#a1a1a6"/></svg>Tolk</h1>
      <p data-i18n="tagline">PC音声をローカルで同時翻訳</p>
    </hgroup>
    <div class="header-actions">
      <a id="shareLink" aria-label="X で共有" data-i18n-label="share" href="https://x.com/intent/tweet?text=Tolk%EF%BD%9C%E7%94%BB%E9%9D%A2%E3%81%AE%E9%9F%B3%E5%A3%B0%E3%82%92%E5%90%8C%E6%99%82%E7%BF%BB%E8%A8%B3&amp;url=https%3A%2F%2Fnoxelwork.com%2Ftolk" target="_blank" rel="noopener noreferrer"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg><span data-i18n="share">X で共有</span></a>
      <label class="ui-lang">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        <select id="uiLang" aria-label="表示言語" data-i18n-label="uiLang"></select>
      </label>
    </div>
  </header>

  <div class="player">
    <fieldset id="controls">
      <div class="langs">
        <select id="src" aria-label="話されている言語" data-i18n-label="src"></select>
        <button id="swap" type="button" aria-label="言語を入れ替える" data-i18n-label="swap"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg></button>
        <select id="tgt" aria-label="字幕の言語" data-i18n-label="tgt"></select>
      </div>
      <div class="options">
        <div class="engine" role="radiogroup" aria-labelledby="engineLabel">
          <span id="engineLabel" data-i18n="engine">音声認識</span>
          <div class="segmented">
            <label><input type="radio" name="engine" value="chrome">Chrome</label>
            <label><input type="radio" name="engine" value="whisper">Whisper</label>
          </div>
        </div>
        <div class="engine" role="radiogroup" aria-labelledby="mtLabel">
          <span id="mtLabel" data-i18n="translation">翻訳</span>
          <div class="segmented">
            <label><input type="radio" name="mt" value="chrome">Chrome</label>
            <label><input type="radio" name="mt" value="plamo">PLaMo</label>
          </div>
        </div>
      </div>
    </fieldset>

    <div id="stageHome">
      <section id="stage" class="stage" aria-label="字幕" data-i18n-label="stage" data-view="checking">
        <div class="bar">
          <p class="live" aria-hidden="true"><span class="dot"></span><span data-i18n="live">翻訳中</span><span id="clock">0:00</span></p>
          <div id="wave" class="wave" aria-hidden="true"></div>
          <div class="bar-actions">
            <button id="pop" type="button" aria-label="小窓で表示" data-i18n-label="pop" hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 9V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10c0 1.1.9 2 2 2h4"/><rect width="10" height="7" x="12" y="13" rx="2"/></svg><span data-i18n="pop">小窓で表示</span></button>
            <button id="stop" type="button" aria-label="停止" data-i18n-label="stop"><svg class="icon icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" fill="currentColor"/></svg><span data-i18n="stop">停止</span></button>
          </div>
        </div>
        <button id="action" type="button" data-icon="share">
          <span class="fill" aria-hidden="true"></span>
          <svg class="icon i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="m17 8 5-5"/><path d="M17 3h5v5"/></svg>
          <svg class="icon i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
          <span class="spinner" aria-hidden="true"></span>
          <span id="actionLabel">画面を選んで翻訳を始める</span>
        </button>
        <p id="status" role="status"></p>
        <p id="hint"><span class="switch" aria-hidden="true"></span><span data-i18n="hint">共有ダイアログで「音声も共有する」をオンにしてください</span></p>
        <p id="plamoNote">Built with PLaMo · <a id="plamoLink" href="https://plamo.preferredai.jp/info/plamo-community-license-ja" target="_blank" rel="noopener noreferrer">PLaMoコミュニティライセンス契約</a></p>
        <p id="waiting" data-i18n="waiting">音声を待っています</p>
        <div id="capTr" class="caption tr"></div>
        <div id="capSrc" class="caption src"></div>
        <div class="sample" aria-hidden="true">
          <p id="demoTr" class="tr">新しい機能を見ていきましょう</p>
          <p id="demoSrc" class="src" lang="en">Let’s take a look at the new features</p>
        </div>
      </section>
      <div id="pipNote" class="pip-note" hidden>
        <p data-i18n="pipShowing">字幕を小窓に表示しています</p>
        <div>
          <button id="unpop" type="button" data-i18n="unpop">タブに戻す</button>
          <button id="stop2" type="button"><svg class="icon icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" fill="currentColor"/></svg><span data-i18n="stop">停止</span></button>
        </div>
      </div>
    </div>
  </div>

  <p class="notice"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg><span data-i18n="notice">パソコン版 Chrome の最新版で開いてください</span></p>


  <section class="log" aria-labelledby="logTitle">
    <div class="log-head">
      <h2 id="logTitle" data-i18n="history">履歴</h2>
      <button id="clear" type="button" data-i18n="clear">消す</button>
    </div>
    <ol id="log"></ol>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
